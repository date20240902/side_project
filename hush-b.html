<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>hush-b</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a130c; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  const MAX = 50;
  const stars = [];
  const BG = '#1a130c';
  const LIFESPAN = 20000;
  const FADE_IN = 3000;
  const FADE_OUT = 4000;

  function spawn(x, y) {
    if (stars.length >= MAX) return;
    stars.push({
      x, y,
      born: performance.now(),
      coreSize: 1.6 + Math.random() * 1.4,
      glowRadius: 20 + Math.random() * 18,
      wobbleAmp: 8 + Math.random() * 10,
      wobbleSpeed: 0.0008 + Math.random() * 0.0006,
      wobblePhase: Math.random() * Math.PI * 2,
      flickerSeed: Math.random() * Math.PI * 2,
    });
  }

  addEventListener('pointerdown', e => spawn(e.clientX, e.clientY));

  let nextAuto = performance.now() + 3000 + Math.random() * 2000;
  let burstRemaining = 0;
  let burstNext = 0;
  function scheduleNext(now) {
    nextAuto = now + 20000 + Math.random() * 12000;
  }

  function frame() {
    const now = performance.now();
    const w = innerWidth;
    const h = innerHeight;

    if (burstRemaining > 0 && now >= burstNext) {
      spawn(Math.random() * w, h + 10);
      burstRemaining--;
      burstNext = now + 400 + Math.random() * 600;
    }

    if (burstRemaining <= 0 && now >= nextAuto) {
      spawn(Math.random() * w, h + 10);
      if (Math.random() < 0.4) {
        burstRemaining = Math.random() < 0.5 ? 1 : 2;
        burstNext = now + 400 + Math.random() * 600;
      }
      scheduleNext(now);
    }

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, w, h);

    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      const age = now - s.born;
      const t = age / LIFESPAN;
      if (t >= 1) { stars.splice(i, 1); continue; }

      const rise = (h + 200) * t;
      const wobble = Math.sin(now * s.wobbleSpeed + s.wobblePhase) * s.wobbleAmp;
      const x = s.x + wobble;
      const y = s.y - rise;

      let a;
      if (age < FADE_IN) a = age / FADE_IN;
      else if (age > LIFESPAN - FADE_OUT) a = (LIFESPAN - age) / FADE_OUT;
      else a = 1;

      const flicker = 0.78 + 0.22 * (0.6 * Math.sin(now / 90 + s.flickerSeed) + 0.4 * Math.sin(now / 230 + s.flickerSeed * 1.3));
      a *= flicker;
      if (a <= 0) continue;

      const grad = ctx.createRadialGradient(x, y, 0, x, y, s.glowRadius);
      grad.addColorStop(0, `rgba(255, 210, 140, ${0.65 * a})`);
      grad.addColorStop(0.25, `rgba(248, 168, 80, ${0.30 * a})`);
      grad.addColorStop(0.6, `rgba(220, 110, 50, ${0.10 * a})`);
      grad.addColorStop(1, 'rgba(220, 110, 50, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, s.glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(255, 238, 200, ${a})`;
      ctx.beginPath();
      ctx.arc(x, y, s.coreSize, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
