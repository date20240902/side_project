<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>hush-c</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1c1a26; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  const MAX = 50;
  const stars = [];
  const BG = '#1c1a26';
  const LIFESPAN = 28000;
  const FADE_IN = 4000;
  const FADE_OUT = 6000;

  function spawn(x, y) {
    if (stars.length >= MAX) return;
    stars.push({
      x, y,
      born: performance.now(),
      coreSize: 1.2 + Math.random() * 1.0,
      glowRadius: 50 + Math.random() * 30,
      driftAmp: 30 + Math.random() * 40,
      driftSpeed: 0.00025 + Math.random() * 0.00035,
      driftPhase: Math.random() * Math.PI * 2,
      hueOffset: Math.random(),
    });
  }

  addEventListener('pointerdown', e => spawn(e.clientX, e.clientY));

  let nextAuto = performance.now() + 3000 + Math.random() * 2000;
  let pairAt = 0;
  let pairPending = false;
  function scheduleNext(now) {
    nextAuto = now + 22000 + Math.random() * 6000;
  }

  function frame() {
    const now = performance.now();
    const w = innerWidth;
    const h = innerHeight;

    if (pairPending && now >= pairAt) {
      spawn(Math.random() * w, h + 10);
      pairPending = false;
    }

    if (now >= nextAuto) {
      spawn(Math.random() * w, h + 10);
      if (Math.random() < 0.3) {
        pairPending = true;
        pairAt = now + 800 + Math.random() * 1400;
      }
      scheduleNext(now);
    }

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, w, h);

    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      const age = now - s.born;
      const t = age / LIFESPAN;
      if (t >= 1) { stars.splice(i, 1); continue; }

      const easedT = 1 - Math.pow(1 - t, 1.4);
      const rise = (h + 200) * easedT;
      const drift = Math.sin(now * s.driftSpeed + s.driftPhase) * s.driftAmp;
      const x = s.x + drift;
      const y = s.y - rise;

      let a;
      if (age < FADE_IN) a = age / FADE_IN;
      else if (age > LIFESPAN - FADE_OUT) a = (LIFESPAN - age) / FADE_OUT;
      else a = 1;
      if (a <= 0) continue;

      const cr = 200 + Math.round(s.hueOffset * 20);
      const cg = 184 + Math.round(s.hueOffset * 16);
      const cb = 232;

      const grad = ctx.createRadialGradient(x, y, 0, x, y, s.glowRadius);
      grad.addColorStop(0, `rgba(${cr}, ${cg}, ${cb}, ${0.35 * a})`);
      grad.addColorStop(0.2, `rgba(${cr}, ${cg}, ${cb}, ${0.18 * a})`);
      grad.addColorStop(0.5, `rgba(${cr - 30}, ${cg - 20}, ${cb - 10}, ${0.06 * a})`);
      grad.addColorStop(1, `rgba(${cr - 30}, ${cg - 20}, ${cb - 10}, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, s.glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(${Math.min(cr + 30, 255)}, ${Math.min(cg + 30, 255)}, 255, ${a * 0.95})`;
      ctx.beginPath();
      ctx.arc(x, y, s.coreSize, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
