<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="crowd" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#22356b"/>
      <rect x="0" y="1" width="2" height="2" fill="#e0623f"/>
      <rect x="4" y="0" width="2" height="2" fill="#e9e4d6"/>
      <rect x="2" y="4" width="2" height="2" fill="#5aa0d8"/>
      <rect x="6" y="5" width="2" height="2" fill="#e7b94a"/>
      <rect x="5" y="3" width="1" height="1" fill="#ffffff"/>
      <rect x="1" y="6" width="1" height="1" fill="#cfd6e6"/>
    </pattern>
    <pattern id="net" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <rect x="0" y="0" width="6" height="1" fill="#ffffff"/>
      <rect x="0" y="0" width="1" height="6" fill="#ffffff"/>
    </pattern>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="2" fill="#ffffff" opacity="0.04"/>
      <rect width="2" height="60" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <linearGradient id="scrim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1430" stop-opacity="0.15"/>
      <stop offset="55%" stop-color="#0f1430" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#0f1430" stop-opacity="0.95"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0f1430"/>

  <g transform="translate(0,-180) scale(6)">
