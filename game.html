<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>월승치못 · 오늘의 예측</title>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/quiple/galmuri/dist/Galmuri.css">
<style>
  @font-face {
    font-family: 'DungGeunMo';
    src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_six@1.2/DungGeunMo.woff') format('woff'),
         url('https://cdn.jsdelivr.net/gh/fontbee/font@main/Orioncactus/DungGeunMo.woff') format('woff');
    font-display: swap;
  }
  :root {
    --bg: #d7e3f7;
    --bg-elev: #fbf3e3;
    --bg-card: #f7ecd9;
    --bg-card-2: #efe0c8;
    --border: #27235a;
    --border-light: #6a64a0;
    --text: #27235a;
    --text-dim: #6a6494;
    --text-faint: #9c96bd;
    --accent: #e23b2e;
    --accent-2: #e7913f;
    --gold: #d39412;
    --green: #2f9e54;
    --blue: #6f8fe0;
    --purple: #8a5cf0;
    --kakao: #FEE500;
    --shadow: 4px 4px 0 rgba(39,35,90,0.26);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: #b9c8e8; }
  body {
    margin: 0 auto; padding: 0; max-width: 460px; min-height: 100vh; position: relative;
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.4) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.4) 1px, transparent 1px);
    background-size: 26px 26px;
    color: var(--text);
    font-family: 'DungGeunMo', 'Galmuri11', monospace; -webkit-font-smoothing: none;
    padding-bottom: 84px;
  }
  button { font-family: inherit; cursor: pointer; }
  b { font-weight: normal; }
  .hidden { display: none !important; }

  /* ===== Top bar ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; background: #0f1430; color: #fff;
    position: sticky; top: 0; z-index: 50; border-bottom: 3px solid var(--border);
  }
  .topbar .logo { font-family: 'DungGeunMo', monospace; font-size: 20px; letter-spacing: 1px; }
  .topbar .logo .dot { color: var(--accent); }
  .topbar .who { font-size: 11px; color: #c7cdf0; }

  /* ===== Login gate ===== */
  .gate { padding: 60px 24px; text-align: center; }
  .gate .g-emoji { font-size: 52px; }
  .gate h1 { font-family: 'DungGeunMo', monospace; font-size: 24px; margin: 16px 0 8px; }
  .gate p { font-size: 13px; color: var(--text-dim); line-height: 1.6; margin: 0 0 28px; }
  .btn-kakao-big {
    width: 100%; padding: 16px; background: var(--kakao); color: #2a2300;
    border: 3px solid var(--border); box-shadow: var(--shadow);
    font-family: 'DungGeunMo', monospace; font-size: 16px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .btn-kakao-big:active { transform: translate(4px,4px); box-shadow: none; }

  /* ===== Pool header ===== */
  .pool {
    margin: 16px; padding: 16px; background: var(--bg-card);
    border: 3px solid var(--border); box-shadow: var(--shadow);
  }
  .pool-top { display: flex; align-items: center; justify-content: space-between; }
  .pool-label { font-size: 12px; color: var(--text-dim); }
  .pool-count { font-family: 'DungGeunMo', monospace; font-size: 30px; line-height: 1; }
  .pool-count .em { color: var(--accent); }
  .gauge-wrap { height: 16px; padding: 3px; background: var(--bg-card-2); border: 2px solid var(--border); margin: 12px 0 6px; overflow: hidden; }
  .gauge-bar { height: 100%; width: 0; background: var(--green); transition: width .4s; }
  .gauge-meta { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-dim); }
  .gauge-meta b { color: var(--accent); }

  /* ===== Section ===== */
  .view { padding: 0 16px; }
  .sec-head { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 12px; }
  .sec-head h2 { font-family: 'DungGeunMo', monospace; font-size: 19px; margin: 0; }
  .sec-head .meta { font-size: 12px; color: var(--text-dim); }
  .sec-head .meta b { color: var(--accent); }

  /* ===== Prize / banner ===== */
  .banner {
    display: flex; align-items: center; gap: 10px; margin: 8px 0 0;
    padding: 12px 14px; background: var(--bg-elev); border: 3px solid var(--border);
    font-size: 12px; line-height: 1.5;
  }
  .banner .b-emoji { font-size: 24px; }
  .banner .accent { color: var(--accent); }

  .dp-banner {
    margin: 14px 0 0; padding: 14px; border: 3px solid var(--border);
    background: linear-gradient(180deg, #fff6e0, #ffe9bf); box-shadow: var(--shadow);
  }
  .dp-banner .dp-t { font-family: 'DungGeunMo', monospace; font-size: 15px; }
  .dp-banner .dp-d { font-size: 11px; color: var(--text-dim); margin: 4px 0 10px; line-height: 1.5; }
  .dp-banner.on { background: linear-gradient(180deg,#e7f7ec,#cdeed7); }
  .btn-share {
    width: 100%; padding: 12px; background: var(--kakao); color: #2a2300;
    border: 3px solid var(--border); font-family: 'DungGeunMo', monospace; font-size: 14px;
  }
  .btn-share:active { transform: translate(2px,2px); }

  /* ===== Question card ===== */
  .q-card { margin: 10px 0; padding: 14px; background: var(--bg-card); border: 3px solid var(--border); box-shadow: var(--shadow); }
  .q-no { font-size: 11px; color: #fff; background: var(--border); padding: 2px 7px; }
  .q-no.jackpot { background: var(--accent); }
  .q-title { font-size: 15px; margin: 8px 0 2px; line-height: 1.45; }
  .q-meta { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }
  .set-label { font-size: 11px; color: var(--text-dim); margin: 8px 0 4px; }
  .set-label.s2 { color: var(--accent-2); }
  .opts { display: flex; gap: 6px; }
  .opt {
    flex: 1; padding: 11px 4px; text-align: center; font-size: 14px;
    background: var(--bg-elev); border: 2px solid var(--border); color: var(--text);
    user-select: none;
  }
  .opt:active { transform: translate(1px,1px); }
  .opt.sel { background: var(--accent); color: #fff; }
  .opt.sel.s2 { background: var(--accent-2); color: #fff; }
  .opt.correct { background: var(--green); color: #fff; border-color: var(--green); }
  .opt.wrong { background: #f3d4d0; color: var(--accent); border-style: dashed; }
  .opt.locked { opacity: .9; pointer-events: none; }
  .q-result { margin-top: 8px; font-size: 11px; color: var(--text-dim); }
  .q-result .ok { color: var(--green); }
  .q-result .no { color: var(--accent); }

  /* vote bar */
  .vote { margin-top: 8px; }
  .vote-row { display: flex; align-items: center; gap: 6px; font-size: 11px; margin: 3px 0; }
  .vote-row .vlabel { width: 40px; color: var(--text-dim); }
  .vote-row .vbarwrap { flex: 1; height: 12px; background: var(--bg-card-2); border: 1px solid var(--border-light); }
  .vote-row .vbar { height: 100%; background: var(--blue); }
  .vote-row .vpct { width: 38px; text-align: right; color: var(--text-dim); }

  /* ===== Submit ===== */
  .submit-btn {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 78px;
    width: calc(100% - 32px); max-width: 428px; padding: 15px;
    background: var(--accent); color: #fff; border: 3px solid var(--border);
    box-shadow: var(--shadow); font-family: 'DungGeunMo', monospace; font-size: 15px; z-index: 40;
  }
  .submit-btn:disabled { background: var(--bg-card-2); color: var(--text-faint); }
  .submit-btn:active:not(:disabled) { transform: translateX(-50%) translateY(2px); }

  /* ===== Result summary ===== */
  .result-box { margin: 14px 0; padding: 16px; background: var(--bg-elev); border: 3px solid var(--border); box-shadow: var(--shadow); text-align: center; }
  .result-box .r-score { font-family: 'DungGeunMo', monospace; font-size: 34px; color: var(--accent); }
  .result-box .r-sub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }
  .set-scores { display: flex; gap: 10px; margin-top: 12px; }
  .set-scores .ss { flex: 1; padding: 10px; border: 2px solid var(--border); background: var(--bg-card); }
  .set-scores .ss.best { background: var(--green); color: #fff; border-color: var(--green); }
  .set-scores .ss .n { font-family: 'DungGeunMo', monospace; font-size: 22px; }
  .set-scores .ss .l { font-size: 10px; }

  /* ===== Leaderboard ===== */
  .lb-row { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 2px solid var(--border); background: var(--bg-card); margin: 6px 0; }
  .lb-row.me { background: #fff6e0; border-color: var(--accent-2); }
  .lb-rank { width: 30px; font-family: 'DungGeunMo', monospace; font-size: 16px; text-align: center; }
  .lb-rank.top { color: var(--accent); }
  .lb-name { flex: 1; font-size: 13px; }
  .lb-score { font-family: 'DungGeunMo', monospace; font-size: 15px; color: var(--accent); }
  .empty { text-align: center; padding: 40px 16px; color: var(--text-dim); font-size: 13px; line-height: 1.7; }
  .empty .e-emoji { font-size: 40px; }

  .tabs { display: flex; gap: 6px; margin: 16px 0 4px; }
  .tab { flex: 1; padding: 9px; text-align: center; font-size: 12px; border: 2px solid var(--border); background: var(--bg-card); }
  .tab.active { background: var(--border); color: #fff; }

  /* ===== Records ===== */
  .rec-row { display: flex; align-items: center; justify-content: space-between; padding: 11px 12px; border: 2px solid var(--border); background: var(--bg-card); margin: 6px 0; }
  .rec-date { font-size: 13px; }
  .rec-score { font-family: 'DungGeunMo', monospace; font-size: 15px; }

  /* ===== Bottom nav ===== */
  .nav {
    position: fixed; left: 50%; transform: translateX(-50%); bottom: 0;
    width: 100%; max-width: 460px; display: flex; background: var(--bg-elev);
    border-top: 3px solid var(--border); z-index: 60;
  }
  .nav-item { flex: 1; padding: 10px 0 12px; text-align: center; color: var(--text-dim); font-size: 11px; }
  .nav-item .ico { font-size: 20px; display: block; }
  .nav-item.active { color: var(--accent); }

  /* ===== Toast ===== */
  .toast {
    position: fixed; left: 50%; bottom: 150px; transform: translateX(-50%) translateY(20px);
    background: var(--border); color: #fff; padding: 12px 18px; font-size: 13px;
    border: 2px solid #fff; opacity: 0; pointer-events: none; transition: all .25s; z-index: 200; text-align: center; max-width: 90%;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .loading { text-align: center; padding: 60px 16px; color: var(--text-dim); }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">월승치못<span class="dot">.</span></div>
  <div class="who" id="who"></div>
</div>

<!-- ===== Login gate ===== -->
<div class="gate hidden" id="gate">
  <div class="g-emoji">🍗</div>
  <h1>오늘의 예측</h1>
  <p>카카오로 로그인하고<br>오늘의 5문제를 맞혀 치킨에 도전하세요!</p>
  <button class="btn-kakao-big" id="kakao-login">💬 카카오로 시작하기</button>
</div>

<!-- ===== App ===== -->
<div id="app" class="hidden">

  <div class="pool">
    <div class="pool-top">
      <div>
        <div class="pool-label">오늘의 치킨 풀</div>
        <div class="pool-count"><span class="em" id="chicken-count">1</span>마리 🍗</div>
      </div>
      <div style="text-align:right">
        <div class="pool-label">참여자</div>
        <div class="pool-count" id="people-count">0</div>
      </div>
    </div>
    <div class="gauge-wrap"><div class="gauge-bar" id="gauge-bar"></div></div>
    <div class="gauge-meta"><span>500명당 +1마리</span><span>다음 치킨까지 <b id="next-count">500</b>명</span></div>
  </div>

  <!-- ===== PLAY view ===== -->
  <div class="view" id="view-play">
    <div class="banner">
      <div class="b-emoji">🏆</div>
      <div>오늘 <b class="accent">정답 최다</b>인 사람 중 추첨 1명에게 치킨!<br>
        <span style="font-size:11px;color:var(--text-dim)">주간 누적 1위에게도 추가 치킨 (매주 리셋)</span></div>
    </div>

    <div class="dp-banner" id="dp-banner"></div>

    <div class="sec-head">
      <h2 id="play-title">오늘의 예측</h2>
      <span class="meta" id="play-date"></span>
    </div>

    <div id="questions"></div>
    <div id="result-area"></div>
  </div>

  <!-- ===== RANK view ===== -->
  <div class="view hidden" id="view-rank">
    <div class="tabs">
      <div class="tab active" data-rtab="daily">오늘 순위</div>
      <div class="tab" data-rtab="weekly">주간 누적</div>
    </div>
    <div class="sec-head"><h2 id="rank-title">오늘 순위</h2><span class="meta" id="rank-date"></span></div>
    <div id="rank-list"></div>
  </div>

  <!-- ===== ME view ===== -->
  <div class="view hidden" id="view-me">
    <div class="sec-head"><h2>내 기록</h2></div>
    <div id="me-list"></div>
  </div>

  <button class="submit-btn hidden" id="submit-btn" disabled>5개 모두 선택해주세요</button>
</div>

<nav class="nav hidden" id="nav">
  <div class="nav-item active" data-nav="play"><span class="ico">⚽</span>오늘의 픽</div>
  <div class="nav-item" data-nav="rank"><span class="ico">🏆</span>순위</div>
  <div class="nav-item" data-nav="me"><span class="ico">📋</span>내 기록</div>
</nav>

<div class="toast" id="toast">완료</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const $$ = (s) => document.querySelectorAll(s);

  const SUPABASE_URL = 'https://mgmaibrwapphvgafzdon.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_5EusOBrKORHh3NpUkRcXNA_ZAlyHg4k';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  const state = {
    user: null,
    questions: [],      // active date's questions
    activeDate: null,
    graded: false,
    picks: { 1: {}, 2: {} },   // set_no -> { question_id: choice }
    dpUnlocked: false,
  };

  function showToast(msg, dur = 2000) {
    const t = $('#toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._tid); t._tid = setTimeout(() => t.classList.remove('show'), dur);
  }
  function nicknameOf(user) {
    const m = (user && user.user_metadata) || {};
    return m.name || m.full_name || m.user_name || m.nickname || m.preferred_username || '치킨러버';
  }
  function todayKST() {
    const now = new Date();
    const kst = new Date(now.getTime() + (now.getTimezoneOffset() + 540) * 60000);
    return kst.toISOString().slice(0, 10);
  }
  function fmtDate(d) {
    const [y, m, day] = d.split('-');
    return `${Number(m)}월 ${Number(day)}일`;
  }
  function weekStart(dateStr) {
    const d = new Date(dateStr + 'T00:00:00');
    const back = (d.getDay() + 6) % 7; // Monday = 0
    d.setDate(d.getDate() - back);
    return d.toISOString().slice(0, 10);
  }

  // ===== Auth =====
  $('#kakao-login').addEventListener('click', async () => {
    const { error } = await sb.auth.signInWithOAuth({
      provider: 'kakao',
      options: { scopes: 'profile_nickname', redirectTo: window.location.origin + window.location.pathname },
    });
    if (error) showToast('로그인을 시작하지 못했어요. 잠시 후 다시 시도해주세요.');
  });

  sb.auth.onAuthStateChange((_e, session) => {
    if (session && !state.user) { state.user = session.user; boot(); }
  });

  async function init() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) { state.user = session.user; boot(); }
    else { $('#gate').classList.remove('hidden'); }
  }

  // ===== Boot (logged in) =====
  async function boot() {
    $('#gate').classList.add('hidden');
    $('#app').classList.remove('hidden');
    $('#nav').classList.remove('hidden');
    $('#who').textContent = nicknameOf(state.user) + ' 님';

    refreshPool();

    // load published questions
    const { data: qs, error } = await sb.from('questions')
      .select('id,match_date,order_no,text,options,correct,status')
      .eq('status', 'published')
      .order('match_date', { ascending: false })
      .order('order_no', { ascending: true });

    if (error) { $('#questions').innerHTML = `<div class="empty">문제를 불러오지 못했어요.</div>`; return; }
    if (!qs || qs.length === 0) { renderEmptyPlay(); return; }

    // choose active date: today if present, else most recent <= today, else earliest upcoming
    const today = todayKST();
    const dates = [...new Set(qs.map(q => q.match_date))].sort();
    let active = dates.includes(today) ? today
      : (dates.filter(d => d <= today).pop() || dates[0]);
    state.activeDate = active;
    state.questions = qs.filter(q => q.match_date === active).sort((a, b) => a.order_no - b.order_no);
    state.graded = state.questions.some(q => q.correct != null);
    state.dpUnlocked = localStorage.getItem('wsmot_dp_' + active) === '1';

    await loadMyPicks();
    renderPlay();
  }

  async function refreshPool() {
    const { data, error } = await sb.rpc('signup_count');
    if (error || data == null) return;
    const people = Number(data);
    const chickens = 1 + Math.floor(people / 500);
    $('#people-count').textContent = people.toLocaleString();
    $('#chicken-count').textContent = chickens;
    const inCycle = people % 500;
    $('#next-count').textContent = 500 - inCycle;
    $('#gauge-bar').style.width = (inCycle / 500 * 100) + '%';
  }

  async function loadMyPicks() {
    const ids = state.questions.map(q => q.id);
    if (!ids.length) return;
    const { data } = await sb.from('predictions')
      .select('question_id,set_no,choice')
      .in('question_id', ids);
    state.picks = { 1: {}, 2: {} };
    (data || []).forEach(p => { state.picks[p.set_no][p.question_id] = p.choice; });
    if (Object.keys(state.picks[2]).length) state.dpUnlocked = true;
  }

  // ===== Render: empty =====
  function renderEmptyPlay() {
    state.questions = [];
    $('#dp-banner').classList.add('hidden');
    $('#play-date').textContent = '';
    $('#questions').innerHTML = `<div class="empty"><div class="e-emoji">⏳</div>
      오늘의 예측은 아직 공개되지 않았어요.<br>경기 시작에 맞춰 매일 5문제가 열립니다!</div>`;
    $('#result-area').innerHTML = '';
    $('#submit-btn').classList.add('hidden');
  }

  // ===== Render: play =====
  function renderPlay() {
    if (!state.questions.length) { renderEmptyPlay(); return; }
    $('#play-date').textContent = fmtDate(state.activeDate);

    renderDpBanner();

    const wrap = $('#questions');
    wrap.innerHTML = '';
    state.questions.forEach((q, i) => wrap.appendChild(renderQuestion(q, i)));

    renderResultOrSubmit();
    if (state.graded) loadVotes();
  }

  function renderDpBanner() {
    const b = $('#dp-banner');
    b.classList.remove('hidden');
    if (state.graded) { b.classList.add('hidden'); return; }
    if (state.dpUnlocked) {
      b.className = 'dp-banner on';
      b.innerHTML = `<div class="dp-t">🎯 더블 픽 사용 중</div>
        <div class="dp-d">예측 세트를 2개 냈어요. 그날 점수는 <b>더 잘 맞힌 세트</b>로 계산돼요.</div>`;
    } else {
      b.className = 'dp-banner';
      b.innerHTML = `<div class="dp-t">🎯 더블 픽 잠금 해제</div>
        <div class="dp-d">친구에게 공유하면 <b>예측 세트를 한 번 더(2세트)</b> 낼 수 있어요. 더 잘 맞힌 세트로 채점!</div>
        <button class="btn-share" id="dp-share">📤 공유하고 더블 픽 받기</button>`;
      $('#dp-share').addEventListener('click', doShare);
    }
  }

  async function doShare() {
    const url = window.location.origin;
    const text = '월드컵 예측하고 치킨 받자! 🍗 월승치못 →';
    try {
      if (navigator.share) await navigator.share({ title: '월승치못', text, url });
      else { await navigator.clipboard.writeText(text + ' ' + url); showToast('🔗 링크 복사 완료! 친구에게 붙여넣기 하세요'); }
    } catch (e) { return; } // cancelled
    localStorage.setItem('wsmot_dp_' + state.activeDate, '1');
    state.dpUnlocked = true;
    renderPlay();
    showToast('🎯 더블 픽 잠금 해제! 세트 2를 채워보세요');
  }

  function renderQuestion(q, idx) {
    const card = document.createElement('div');
    card.className = 'q-card';
    const jackpot = /난입|잭팟|🎰/.test(q.text);
    const sets = (state.dpUnlocked || Object.keys(state.picks[2]).length) ? [1, 2] : [1];

    let html = `<span class="q-no${jackpot ? ' jackpot' : ''}">Q${q.order_no}${jackpot ? ' 🎰' : ''}</span>
      <div class="q-title">${escapeHtml(q.text)}</div>`;

    if (state.graded) {
      // result mode
      sets.forEach(setNo => {
        if (setNo === 2 && !Object.keys(state.picks[2]).length) return;
        const my = state.picks[setNo][q.id];
        html += `<div class="set-label${setNo === 2 ? ' s2' : ''}">${setNo === 1 ? '세트 1' : '세트 2'}</div>`;
        html += `<div class="opts">` + q.options.map(o => {
          let cls = 'opt locked';
          if (q.correct != null && o === q.correct) cls += ' correct';
          else if (my === o) cls += ' wrong';
          return `<div class="${cls}">${escapeHtml(o)}</div>`;
        }).join('') + `</div>`;
      });
      if (q.correct == null) html += `<div class="q-result">채점 대기중 · 경기 후 정답 공개</div>`;
      html += `<div class="vote" data-qid="${q.id}"></div>`;
    } else {
      // pick mode
      sets.forEach(setNo => {
        html += `<div class="set-label${setNo === 2 ? ' s2' : ''}">${setNo === 1 ? '세트 1' : '세트 2 (더블 픽)'}</div>`;
        const my = state.picks[setNo][q.id];
        html += `<div class="opts" data-qid="${q.id}" data-set="${setNo}">` + q.options.map(o =>
          `<div class="opt${my === o ? (setNo === 2 ? ' sel s2' : ' sel') : ''}" data-opt="${escapeAttr(o)}">${escapeHtml(o)}</div>`
        ).join('') + `</div>`;
      });
    }
    card.innerHTML = html;

    if (!state.graded) {
      card.querySelectorAll('.opts').forEach(row => {
        row.addEventListener('click', e => {
          const opt = e.target.closest('.opt'); if (!opt) return;
          const qid = Number(row.dataset.qid), setNo = Number(row.dataset.set);
          state.picks[setNo][qid] = opt.dataset.opt;
          row.querySelectorAll('.opt').forEach(o => o.classList.remove('sel', 's2'));
          opt.classList.add('sel'); if (setNo === 2) opt.classList.add('s2');
          updateSubmit();
        });
      });
    }
    return card;
  }

  function set1Complete() {
    return state.questions.length > 0 && state.questions.every(q => state.picks[1][q.id]);
  }

  function renderResultOrSubmit() {
    const btn = $('#submit-btn');
    const area = $('#result-area');
    if (state.graded) {
      btn.classList.add('hidden');
      area.innerHTML = renderResultSummary();
    } else {
      area.innerHTML = '';
      btn.classList.remove('hidden');
      updateSubmit();
      btn.onclick = submitPicks;
    }
  }

  function updateSubmit() {
    const btn = $('#submit-btn');
    const ok = set1Complete();
    btn.disabled = !ok;
    const already = Object.keys(state.picks[1]).length === state.questions.length && state.questions.length > 0;
    btn.textContent = ok ? (already ? '✅ 예측 수정하기' : '예측 제출하기') : '5개 모두 선택해주세요';
  }

  function score(setNo) {
    return state.questions.reduce((n, q) =>
      n + (q.correct != null && state.picks[setNo][q.id] === q.correct ? 1 : 0), 0);
  }

  function renderResultSummary() {
    const has2 = Object.keys(state.picks[2]).length > 0;
    const s1 = score(1), s2 = has2 ? score(2) : -1;
    const best = Math.max(s1, s2);
    const gradedCount = state.questions.filter(q => q.correct != null).length;
    let html = `<div class="result-box">
      <div class="r-score">${best} / ${state.questions.length}</div>
      <div class="r-sub">오늘 점수${gradedCount < state.questions.length ? ' (일부 채점 중)' : ''}</div>`;
    if (has2) {
      html += `<div class="set-scores">
        <div class="ss${s1 >= s2 ? ' best' : ''}"><div class="n">${s1}</div><div class="l">세트 1</div></div>
        <div class="ss${s2 > s1 ? ' best' : ''}"><div class="n">${s2}</div><div class="l">세트 2</div></div>
      </div><div class="r-sub" style="margin-top:8px">더 잘 맞힌 세트로 채점돼요</div>`;
    }
    html += `</div>`;
    return html;
  }

  async function loadVotes() {
    const { data, error } = await sb.rpc('vote_counts', { p_match_date: state.activeDate });
    if (error || !data) return;
    const byQ = {};
    data.forEach(r => { (byQ[r.question_id] = byQ[r.question_id] || []).push(r); });
    state.questions.forEach(q => {
      const slot = document.querySelector(`.vote[data-qid="${q.id}"]`);
      if (!slot) return;
      const rows = byQ[q.id] || [];
      const total = rows.reduce((n, r) => n + Number(r.votes), 0);
      if (!total) { slot.innerHTML = ''; return; }
      slot.innerHTML = `<div class="set-label">투표율</div>` + q.options.map(o => {
        const v = Number((rows.find(r => r.choice === o) || {}).votes || 0);
        const pct = Math.round(v / total * 100);
        return `<div class="vote-row"><span class="vlabel">${escapeHtml(o)}</span>
          <span class="vbarwrap"><span class="vbar" style="width:${pct}%"></span></span>
          <span class="vpct">${pct}%</span></div>`;
      }).join('');
    });
  }

  async function submitPicks() {
    const btn = $('#submit-btn');
    btn.disabled = true; btn.textContent = '제출 중...';
    const rows = [];
    state.questions.forEach(q => {
      if (state.picks[1][q.id]) rows.push({ user_id: state.user.id, question_id: q.id, set_no: 1, choice: state.picks[1][q.id] });
      if (state.dpUnlocked && state.picks[2][q.id]) rows.push({ user_id: state.user.id, question_id: q.id, set_no: 2, choice: state.picks[2][q.id] });
    });
    const { error } = await sb.from('predictions').upsert(rows, { onConflict: 'user_id,question_id,set_no' });
    if (error) { showToast('제출에 실패했어요. 다시 시도해주세요.'); updateSubmit(); return; }
    showToast('✅ 예측이 제출됐어요! 행운을 빌어요 🍀');
    updateSubmit();
  }

  // ===== Rank =====
  let rankTab = 'daily';
  $$('[data-rtab]').forEach(t => t.addEventListener('click', () => {
    rankTab = t.dataset.rtab;
    $$('[data-rtab]').forEach(x => x.classList.toggle('active', x === t));
    renderRank();
  }));

  async function renderRank() {
    const list = $('#rank-list');
    const date = state.activeDate || todayKST();
    if (rankTab === 'daily') {
      $('#rank-title').textContent = '오늘 순위';
      $('#rank-date').textContent = fmtDate(date);
      list.innerHTML = `<div class="loading">불러오는 중...</div>`;
      const { data, error } = await sb.rpc('daily_leaderboard', { p_match_date: date, p_limit: 50 });
      renderLbRows(list, (error ? [] : data) || [], 'score');
    } else {
      const ws = weekStart(date);
      $('#rank-title').textContent = '주간 누적';
      $('#rank-date').textContent = fmtDate(ws) + ' 주';
      list.innerHTML = `<div class="loading">불러오는 중...</div>`;
      const { data, error } = await sb.rpc('weekly_leaderboard', { p_week_start: ws, p_limit: 50 });
      renderLbRows(list, (error ? [] : data) || [], 'total');
    }
  }

  function renderLbRows(list, rows, scoreKey) {
    if (!rows.length) { list.innerHTML = `<div class="empty"><div class="e-emoji">🥲</div>아직 순위가 없어요.<br>예측을 제출하고 채점되면 순위가 올라가요!</div>`; return; }
    const myId = state.user.id;
    list.innerHTML = rows.map((r, i) => {
      const isMe = r.user_id === myId;
      const rankCls = i < 3 ? 'lb-rank top' : 'lb-rank';
      const medal = ['🥇', '🥈', '🥉'][i] || (i + 1);
      return `<div class="lb-row${isMe ? ' me' : ''}">
        <div class="${rankCls}">${medal}</div>
        <div class="lb-name">${escapeHtml(r.nickname || '익명의 치킨러버')}${isMe ? ' (나)' : ''}</div>
        <div class="lb-score">${r[scoreKey]}점</div>
      </div>`;
    }).join('');
  }

  // ===== Me =====
  async function renderMe() {
    const list = $('#me-list');
    list.innerHTML = `<div class="loading">불러오는 중...</div>`;
    const { data, error } = await sb.from('daily_scores')
      .select('match_date,score')
      .order('match_date', { ascending: false });
    if (error) { list.innerHTML = `<div class="empty">기록을 불러오지 못했어요.</div>`; return; }
    if (!data || !data.length) { list.innerHTML = `<div class="empty"><div class="e-emoji">📋</div>아직 채점된 기록이 없어요.<br>오늘의 예측에 참여해보세요!</div>`; return; }
    const total = data.reduce((n, r) => n + Number(r.score), 0);
    list.innerHTML = `<div class="result-box"><div class="r-score">${total}점</div><div class="r-sub">누적 정답 (${data.length}일 참여)</div></div>`
      + data.map(r => `<div class="rec-row"><span class="rec-date">${fmtDate(r.match_date)}</span><span class="rec-score">${r.score} / 5</span></div>`).join('');
  }

  // ===== Nav =====
  $$('[data-nav]').forEach(n => n.addEventListener('click', () => {
    const name = n.dataset.nav;
    $$('[data-nav]').forEach(x => x.classList.toggle('active', x === n));
    ['play', 'rank', 'me'].forEach(v => $('#view-' + v).classList.toggle('hidden', v !== name));
    $('#submit-btn').classList.toggle('hidden', name !== 'play' || state.graded || !state.questions.length);
    if (name === 'rank') renderRank();
    if (name === 'me') renderMe();
  }));

  // ===== utils =====
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function escapeAttr(s) { return escapeHtml(s); }

  init();
})();
</script>
</body>
</html>
