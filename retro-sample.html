<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>월승치못 · 레트로 게임 스타일 샘플</title>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/quiple/galmuri/dist/Galmuri.css">
<style>
  :root {
    --ink: #20264f;
    --gold: #ffd24a; --red: #e23b2e; --green: #74c96a; --blue: #6f8fe0;
    --cyan: #2fd3bf; --cyan-dot: #0c9a88;
    --panel: #f7ecd9; --panel-2: #efe0c8;
    --teal: #7cc6c0; --orange: #e7913f; --kakao: #FEE500;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: #cfe6f7;
    color: var(--ink); font-family: 'Galmuri11', monospace; -webkit-font-smoothing: none;
  }
  .col { max-width: 460px; margin: 0 auto; padding: 0 0 40px; }

  /* arcade halftone frame */
  .frame {
    margin: 14px; padding: 12px; border-radius: 5px;
    background: var(--cyan);
    background-image: radial-gradient(var(--cyan-dot) 30%, transparent 33%);
    background-size: 8px 8px;
    box-shadow: 0 6px 0 rgba(32,38,79,.4);
  }
  .screen {
    position: relative; border: 4px solid var(--ink); border-radius: 2px;
    overflow: hidden; line-height: 0; background: #aed9f2;
  }
  .scene { width: 100%; display: block; image-rendering: pixelated; }

  .overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
  .hud { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 20px 24px; background: rgba(18,22,46,0.62); border: 3px solid rgba(255,255,255,0.28); border-radius: 6px; }
  .lives { position: absolute; top: 10px; right: 12px; font-size: 16px; letter-spacing: 2px; z-index: 6; }
  .badge { font-size: 11px; color: var(--ink); background: var(--gold); border: 3px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); padding: 4px 10px; }
  .game-title {
    font-family: 'Galmuri14', monospace; font-size: clamp(40px, 13vw, 56px); line-height: 1; color: #fff;
    text-shadow:
      -3px 0 var(--ink), 3px 0 var(--ink), 0 -3px var(--ink), 0 3px var(--ink),
      3px 3px 0 var(--ink), -3px 3px 0 var(--ink), 6px 6px 0 var(--red);
  }
  .game-sub { font-size: 14px; color: #ffffff; }
  .btn-start { font-family: 'Galmuri14', monospace; font-size: 20px; color: #2a2300; background: var(--kakao); border: 4px solid var(--ink); border-radius: 999px; box-shadow: 0 5px 0 var(--ink); padding: 13px 30px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
  .btn-start .kbox { width: 18px; height: 18px; background: var(--ink); color: var(--kakao); display: grid; place-items: center; font-size: 11px; border-radius: 2px; }
  .btn-start:active { transform: translateY(5px); box-shadow: none; }
  .press { font-size: 11px; color: var(--gold); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== windows ===== */
  .stage-label { text-align: center; font-family:'Galmuri14',monospace; font-size: 15px; margin: 4px 0 14px; text-shadow: 1px 1px 0 #fff; }
  .win { background: var(--panel); border: 3px solid var(--ink); border-radius: 3px; box-shadow: 5px 5px 0 rgba(32,38,79,.3); margin: 0 14px 18px; }
  .win-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 3px solid var(--ink); }
  .win-bar.teal { background: var(--teal); } .win-bar.orange { background: var(--orange); }
  .win-title { font-size: 13px; color: var(--ink); }
  .win-ctrls { display: flex; gap: 4px; }
  .win-ctrls i { font-style: normal; width: 18px; height: 18px; display: grid; place-items: center; background: var(--panel); border: 2px solid var(--ink); font-size: 11px; }
  .win-body { padding: 16px; }
  .gauge-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-bottom: 10px; }
  .gauge-num { font-family: 'Galmuri14', monospace; font-size: 20px; color: var(--orange); }
  .loadbar { height: 24px; padding: 3px; background: var(--panel-2); border: 3px solid var(--ink); border-radius: 2px; }
  .loadbar > span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--blue) 0 11px, transparent 11px 14px); }
  .gauge-note { font-size: 11px; color: #6b5a4f; margin-top: 9px; text-align: center; } .gauge-note b { color: var(--ink); }
  .score { display: flex; align-items: center; justify-content: space-around; background: var(--ink); border-radius: 3px; padding: 10px; margin-bottom: 14px; }
  .score .team { font-family: 'Galmuri14', monospace; font-size: 16px; color: var(--gold); }
  .score .vs { font-size: 13px; color: var(--red); }
  .opts { display: flex; gap: 8px; margin-bottom: 16px; }
  .opt { flex: 1; padding: 14px 0; background: var(--panel-2); color: var(--ink); border: 3px solid var(--ink); border-radius: 3px; box-shadow: 2px 2px 0 var(--ink); font-family: 'Galmuri11', monospace; font-size: 16px; cursor: pointer; }
  .opt:active { transform: translate(2px,2px); box-shadow: none; }
  .opt.sel { background: var(--red); color: #fff; }
  .ok { width: 100%; padding: 12px; background: var(--panel-2); color: var(--ink); border: 2px dashed var(--ink); border-radius: 3px; font-family: 'Galmuri11', monospace; font-size: 14px; cursor: pointer; }
  .foot { text-align: center; font-size: 11px; margin-top: 6px; opacity: .8; }
</style>
</head>
<body>
<div class="col">

  <!-- ===== STADIUM TITLE SCREEN ===== -->
  <div class="frame">
    <div class="screen">
      <svg class="scene" viewBox="0 0 200 165" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="crowd" width="8" height="8" patternUnits="userSpaceOnUse">
            <rect width="8" height="8" fill="#22356b"/>
            <rect x="0" y="1" width="2" height="2" fill="#e0623f"/>
            <rect x="4" y="0" width="2" height="2" fill="#e9e4d6"/>
            <rect x="2" y="4" width="2" height="2" fill="#5aa0d8"/>
            <rect x="6" y="5" width="2" height="2" fill="#e7b94a"/>
            <rect x="5" y="3" width="1" height="1" fill="#ffffff"/>
            <rect x="1" y="6" width="1" height="1" fill="#cfd6e6"/>
          </pattern>
          <pattern id="net" width="6" height="6" patternUnits="userSpaceOnUse">
            <rect width="6" height="6" fill="none"/>
            <rect x="0" y="0" width="6" height="1" fill="#ffffff"/>
            <rect x="0" y="0" width="1" height="6" fill="#ffffff"/>
          </pattern>
        </defs>

        <!-- crowd -->
        <rect x="0" y="0" width="200" height="46" fill="url(#crowd)"/>
        <!-- ad boards -->
        <rect x="0" y="46" width="200" height="9" fill="#e7e0d0"/>
        <rect x="6" y="47" width="40" height="7" fill="#e23b2e"/>
        <rect x="70" y="47" width="46" height="7" fill="#2f6fd0"/>
        <rect x="140" y="47" width="40" height="7" fill="#e7913f"/>
        <!-- pitch -->
        <rect x="0" y="55" width="200" height="110" fill="#5fb457"/>
        <rect x="0" y="55" width="200" height="14" fill="#67bd5e"/>
        <rect x="0" y="83" width="200" height="14" fill="#67bd5e"/>
        <rect x="0" y="111" width="200" height="14" fill="#67bd5e"/>
        <rect x="0" y="139" width="200" height="14" fill="#67bd5e"/>

        <!-- goal -->
        <rect x="64" y="56" width="74" height="38" fill="url(#net)" opacity="0.55"/>
        <rect x="64" y="54" width="74" height="3" fill="#ffffff"/>
        <rect x="64" y="54" width="3" height="40" fill="#ffffff"/>
        <rect x="135" y="54" width="3" height="40" fill="#ffffff"/>

        <!-- shadows -->
        <ellipse cx="92" cy="135" rx="17" ry="4" fill="#1c5a1f" opacity="0.22"/>
        <ellipse cx="129" cy="133" rx="9" ry="3" fill="#1c5a1f" opacity="0.22"/>

        <!-- ball -->
        <g transform="translate(121,116)">
          <rect x="1" y="1" width="14" height="14" rx="7" fill="#ffffff" stroke="#20264f" stroke-width="2"/>
          <rect x="6" y="3" width="4" height="4" fill="#20264f"/>
          <rect x="3" y="8" width="3" height="3" fill="#20264f"/>
          <rect x="10" y="9" width="3" height="3" fill="#20264f"/>
        </g>

        <!-- player (red kit) -->
        <g transform="translate(74,72)">
          <rect x="4" y="0" width="20" height="8" fill="#1f2a52"/>
          <rect x="4" y="8" width="4" height="6" fill="#1f2a52"/>
          <rect x="20" y="8" width="4" height="6" fill="#1f2a52"/>
          <rect x="8" y="7" width="12" height="11" fill="#b56b39"/>
          <rect x="10" y="12" width="2" height="2" fill="#20264f"/>
          <rect x="16" y="12" width="2" height="2" fill="#20264f"/>
          <rect x="4" y="18" width="20" height="15" fill="#e23b2e"/>
          <rect x="0" y="19" width="5" height="7" fill="#e23b2e"/>
          <rect x="23" y="19" width="5" height="7" fill="#e23b2e"/>
          <rect x="0" y="26" width="5" height="7" fill="#b56b39"/>
          <rect x="23" y="26" width="5" height="7" fill="#b56b39"/>
          <rect x="4" y="33" width="9" height="9" fill="#1f2a52"/>
          <rect x="15" y="33" width="9" height="9" fill="#1f2a52"/>
          <rect x="5" y="42" width="7" height="9" fill="#b56b39"/>
          <rect x="16" y="42" width="7" height="9" fill="#b56b39"/>
          <rect x="5" y="51" width="7" height="5" fill="#e23b2e"/>
          <rect x="16" y="51" width="7" height="5" fill="#e23b2e"/>
          <rect x="3" y="56" width="10" height="5" fill="#20264f"/>
          <rect x="16" y="56" width="10" height="5" fill="#20264f"/>
        </g>
      </svg>

      <div class="lives">🍗🍗🍗</div>
      <div class="overlay">
        <div class="hud">
          <div class="badge">WORLD CUP 2026</div>
          <div class="game-title">월승치못</div>
          <div class="game-sub">매일 5문제 예측하고 치킨 받자</div>
          <button class="btn-start"><span class="kbox">K</span> 카카오로 시작</button>
          <div class="press">PRESS START · 사전 예약 한정 더블픽 3장</div>
        </div>
      </div>
    </div>
  </div>

  <div class="stage-label">▼ STAGE 1 미리보기</div>

  <!-- CHICKEN GAUGE -->
  <div class="win">
    <div class="win-bar orange">
      <span class="win-title">🍗 오늘의 치킨 풀</span>
      <span class="win-ctrls"><i>_</i><i>☐</i><i>✕</i></span>
    </div>
    <div class="win-body">
      <div class="gauge-top"><span>적립된 치킨</span><b class="gauge-num">1마리</b></div>
      <div class="loadbar"><span style="width:49%"></span></div>
      <div class="gauge-note">다음 치킨까지 <b>253명</b> · 500명마다 +1마리</div>
    </div>
  </div>

  <!-- PREDICTION -->
  <div class="win">
    <div class="win-bar teal">
      <span class="win-title">⚽ 오늘의 예측 &nbsp;1/5</span>
      <span class="win-ctrls"><i>_</i><i>☐</i><i>✕</i></span>
    </div>
    <div class="win-body">
      <div class="score"><span class="team">🇰🇷 한국</span><span class="vs">VS</span><span class="team">우루과이 🇺🇾</span></div>
      <div class="opts" id="opts">
        <button class="opt sel">승</button>
        <button class="opt">무</button>
        <button class="opt">패</button>
      </div>
      <button class="ok">제출하기 ▸</button>
    </div>
  </div>

  <div class="foot">RETRO GAME STYLE SAMPLE · 본선까지 <b id="dday">D-20</b></div>
</div>

<script>
  const KICKOFF = new Date('2026-06-11T00:00:00+09:00');
  const days = Math.ceil((KICKOFF - new Date()) / 86400000);
  document.getElementById('dday').textContent = days > 0 ? 'D-' + days : (days === 0 ? 'D-DAY' : '진행중');
  document.getElementById('opts').addEventListener('click', (e) => {
    const b = e.target.closest('.opt'); if (!b) return;
    document.querySelectorAll('#opts .opt').forEach(o => o.classList.remove('sel'));
    b.classList.add('sel');
  });
</script>
</body>
</html>
