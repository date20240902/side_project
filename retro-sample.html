<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>월승치못 · 레트로 게임 스타일 샘플</title>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/quiple/galmuri/dist/Galmuri.css">
<style>
  :root {
    --sky-top: #bfe0ff; --sky-mid: #f6c9e6; --sky-low: #b6a2ec;
    --ink: #27235a;
    --gold: #ffd24a; --red: #ef5d6b; --green: #74c96a; --blue: #6f8fe0;
    --stand: #514593; --stand-2: #463c83;
    --win-lamp: #ffe08a;
    --field-a: #4bab4b; --field-b: #429a42; --line: #eaf2ff;
    --panel: #f7ecd9; --panel-2: #efe0c8;
    --teal: #7cc6c0; --orange: #e7913f; --kakao: #FEE500;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 60%, var(--sky-low) 100%);
    background-attachment: fixed;
    color: var(--ink); font-family: 'Galmuri11', monospace; -webkit-font-smoothing: none;
  }
  .col { max-width: 460px; margin: 0 auto; padding: 0 0 40px; }

  /* ===== STADIUM TITLE SCREEN ===== */
  .screen {
    position: relative; height: 520px; overflow: hidden;
    border: 4px solid var(--ink); border-radius: 4px;
    margin: 14px 14px 22px; box-shadow: 0 6px 0 rgba(39,35,90,.35);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 62%, var(--sky-low) 100%);
  }
  .star { position: absolute; color: #fff; font-size: 12px; animation: tw 2.2s infinite; z-index: 1; }
  .star.s2 { animation-delay: .7s; } .star.s3 { animation-delay: 1.3s; }
  @keyframes tw { 0%,100%{ opacity:.25; transform:scale(.8);} 50%{ opacity:1; transform:scale(1.1);} }

  .lives { position: absolute; top: 12px; right: 14px; font-size: 16px; letter-spacing: 2px; z-index: 7; }

  /* floodlights */
  .light { position: absolute; bottom: 196px; width: 6px; height: 78px; background: var(--ink); z-index: 2; }
  .light.l { left: 30px; } .light.r { right: 30px; }
  .light::before {
    content: ''; position: absolute; top: -20px; left: -13px;
    width: 32px; height: 22px; background: var(--win-lamp);
    border: 3px solid var(--ink); border-radius: 2px;
    background-image: radial-gradient(rgba(39,35,90,.45) 1px, transparent 1.6px);
    background-size: 7px 7px;
    box-shadow: 0 0 22px 7px rgba(255,224,138,.75);
  }

  /* stadium stands (crowd) */
  .stands {
    position: absolute; left: 0; right: 0; bottom: 150px; height: 70px; z-index: 2;
    background:
      radial-gradient(rgba(255,255,255,.55) 1px, transparent 1.7px),
      radial-gradient(rgba(255,210,74,.5) 1px, transparent 1.7px),
      linear-gradient(180deg, var(--stand) 0%, var(--stand-2) 100%);
    background-size: 9px 9px, 9px 9px, 100% 100%;
    background-position: 0 0, 4px 5px, 0 0;
    border-top: 4px solid var(--ink);
    border-bottom: 4px solid var(--ink);
  }

  /* pitch */
  .field {
    position: absolute; left: 0; right: 0; bottom: 0; height: 150px; z-index: 3; overflow: hidden;
    background: repeating-linear-gradient(90deg, var(--field-a) 0 30px, var(--field-b) 30px 60px);
    border-top: 4px solid var(--ink);
  }
  .field .cline { position: absolute; left: 50%; top: 0; bottom: 0; width: 3px; background: var(--line); transform: translateX(-50%); opacity: .85; }
  .field .ccircle { position: absolute; left: 50%; top: 50%; width: 66px; height: 66px; border: 3px solid var(--line); border-radius: 50%; transform: translate(-50%,-50%); opacity: .85; }
  .field .goal {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    width: 16px; height: 64px; border: 3px solid #fff; border-right: none;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.5) 0 2px, transparent 2px 8px),
      repeating-linear-gradient(90deg, rgba(255,255,255,.5) 0 2px, transparent 2px 8px);
  }

  /* pixel players */
  .player { position: absolute; width: 14px; height: 24px; z-index: 4; }
  .player .h { position: absolute; top: 0; left: 4px; width: 7px; height: 7px; background: #f0c49a; border: 2px solid var(--ink); border-radius: 2px; }
  .player .b { position: absolute; top: 8px; left: 0; width: 14px; height: 11px; border: 2px solid var(--ink); border-radius: 2px; }
  .player .lg { position: absolute; bottom: 0; left: 2px; width: 10px; height: 6px; border-left: 3px solid var(--ink); border-right: 3px solid var(--ink); }
  .player.red .b { background: var(--red); }
  .player.blue .b { background: var(--blue); }
  .player.gk .b { background: var(--gold); }

  .ball {
    position: absolute; z-index: 5; width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 2px solid var(--ink);
    background-image: radial-gradient(var(--ink) 2px, transparent 2.6px); background-size: 7px 7px;
  }

  /* title + start */
  .title-wrap { position: absolute; left: 0; right: 0; top: 44px; z-index: 6; text-align: center; padding: 0 16px; }
  .badge { display: inline-block; font-size: 11px; color: var(--ink); background: var(--gold); border: 3px solid var(--ink); box-shadow: 2px 2px 0 var(--ink); padding: 4px 10px; margin-bottom: 14px; }
  .game-title { font-family: 'Galmuri14', monospace; font-size: 52px; line-height: 1; color: var(--gold); letter-spacing: 1px; text-shadow: 3px 3px 0 var(--red), 6px 6px 0 rgba(39,35,90,.45); }
  .game-sub { margin-top: 13px; font-size: 13px; }
  .game-sub .hi { color: #fff; text-shadow: 1px 1px 0 var(--ink); }

  .start-wrap { position: absolute; left: 0; right: 0; bottom: 168px; z-index: 6; text-align: center; }
  .btn-start { font-family: 'Galmuri14', monospace; font-size: 20px; color: #14310f; background: var(--green); border: 4px solid var(--ink); border-radius: 999px; box-shadow: 0 5px 0 var(--ink); padding: 13px 30px; cursor: pointer; }
  .btn-start:active { transform: translateY(5px); box-shadow: none; }
  .press { margin-top: 12px; font-size: 11px; color: var(--ink); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== windows ===== */
  .stage-label { text-align: center; font-family:'Galmuri14',monospace; font-size: 15px; margin: 4px 0 14px; text-shadow: 1px 1px 0 #fff; }
  .win { background: var(--panel); border: 3px solid var(--ink); border-radius: 3px; box-shadow: 5px 5px 0 rgba(39,35,90,.3); margin: 0 14px 18px; }
  .win-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 3px solid var(--ink); }
  .win-bar.teal { background: var(--teal); } .win-bar.orange { background: var(--orange); }
  .win-title { font-size: 13px; color: var(--ink); }
  .win-ctrls { display: flex; gap: 4px; }
  .win-ctrls i { font-style: normal; width: 18px; height: 18px; display: grid; place-items: center; background: var(--panel); border: 2px solid var(--ink); font-size: 11px; }
  .win-body { padding: 16px; }

  .gauge-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-bottom: 10px; }
  .gauge-num { font-family: 'Galmuri14', monospace; font-size: 20px; color: var(--orange); }
  .loadbar { height: 24px; padding: 3px; background: var(--panel-2); border: 3px solid var(--ink); border-radius: 2px; }
  .loadbar > span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--blue) 0 11px, transparent 11px 14px); }
  .gauge-note { font-size: 11px; color: #6b5a4f; margin-top: 9px; text-align: center; } .gauge-note b { color: var(--ink); }

  .score { display: flex; align-items: center; justify-content: space-around; background: var(--ink); border-radius: 3px; padding: 10px; margin-bottom: 14px; }
  .score .team { font-family: 'Galmuri14', monospace; font-size: 16px; color: var(--gold); }
  .score .vs { font-size: 13px; color: var(--red); }
  .opts { display: flex; gap: 8px; margin-bottom: 16px; }
  .opt { flex: 1; padding: 14px 0; background: var(--panel-2); color: var(--ink); border: 3px solid var(--ink); border-radius: 3px; box-shadow: 2px 2px 0 var(--ink); font-family: 'Galmuri11', monospace; font-size: 16px; cursor: pointer; }
  .opt:active { transform: translate(2px,2px); box-shadow: none; }
  .opt.sel { background: var(--red); color: #fff; }
  .ok { width: 100%; padding: 12px; background: var(--panel-2); color: var(--ink); border: 2px dashed var(--ink); border-radius: 3px; font-family: 'Galmuri11', monospace; font-size: 14px; cursor: pointer; }

  .foot { text-align: center; font-size: 11px; margin-top: 6px; opacity: .8; }
</style>
</head>
<body>
<div class="col">

  <!-- ===== STADIUM TITLE SCREEN ===== -->
  <div class="screen">
    <span class="star" style="top:22px;left:34px;">✦</span>
    <span class="star s2" style="top:40px;left:120px;font-size:9px;">✦</span>
    <span class="star s3" style="top:16px;right:90px;">✦</span>
    <span class="star s2" style="top:58px;right:44px;font-size:9px;">✦</span>

    <div class="lives">🍗🍗🍗</div>

    <!-- floodlights -->
    <div class="light l"></div>
    <div class="light r"></div>

    <!-- crowd stands -->
    <div class="stands"></div>

    <!-- title -->
    <div class="title-wrap">
      <div class="badge">WORLD CUP 2026</div>
      <div class="game-title">월승치못</div>
      <div class="game-sub"><span class="hi">매일 5문제 예측하고 치킨 받자</span></div>
    </div>

    <!-- START -->
    <div class="start-wrap">
      <button class="btn-start">▶ 카카오로 시작</button>
      <div class="press">PRESS START · 사전 예약 한정 더블픽 3장</div>
    </div>

    <!-- pitch -->
    <div class="field">
      <div class="cline"></div>
      <div class="ccircle"></div>
      <div class="goal"></div>
      <div class="player red" style="left:30%;bottom:54px;"><span class="h"></span><span class="b"></span><span class="lg"></span></div>
      <div class="player blue" style="left:52%;bottom:48px;"><span class="h"></span><span class="b"></span><span class="lg"></span></div>
      <div class="player red" style="left:18%;bottom:34px;"><span class="h"></span><span class="b"></span><span class="lg"></span></div>
      <div class="player gk" style="right:30px;bottom:50px;"><span class="h"></span><span class="b"></span><span class="lg"></span></div>
      <div class="ball" style="left:44%;bottom:40px;"></div>
    </div>
  </div>

  <div class="stage-label">▼ STAGE 1 미리보기</div>

  <!-- CHICKEN GAUGE -->
  <div class="win">
    <div class="win-bar orange">
      <span class="win-title">🍗 오늘의 치킨 풀</span>
      <span class="win-ctrls"><i>_</i><i>☐</i><i>✕</i></span>
    </div>
    <div class="win-body">
      <div class="gauge-top"><span>적립된 치킨</span><b class="gauge-num">1마리</b></div>
      <div class="loadbar"><span style="width:49%"></span></div>
      <div class="gauge-note">다음 치킨까지 <b>253명</b> · 500명마다 +1마리</div>
    </div>
  </div>

  <!-- PREDICTION -->
  <div class="win">
    <div class="win-bar teal">
      <span class="win-title">⚽ 오늘의 예측 &nbsp;1/5</span>
      <span class="win-ctrls"><i>_</i><i>☐</i><i>✕</i></span>
    </div>
    <div class="win-body">
      <div class="score"><span class="team">🇰🇷 한국</span><span class="vs">VS</span><span class="team">우루과이 🇺🇾</span></div>
      <div class="opts" id="opts">
        <button class="opt sel">승</button>
        <button class="opt">무</button>
        <button class="opt">패</button>
      </div>
      <button class="ok">제출하기 ▸</button>
    </div>
  </div>

  <div class="foot">RETRO GAME STYLE SAMPLE · 본선까지 <b id="dday">D-20</b></div>
</div>

<script>
  const KICKOFF = new Date('2026-06-11T00:00:00+09:00');
  const days = Math.ceil((KICKOFF - new Date()) / 86400000);
  document.getElementById('dday').textContent = days > 0 ? 'D-' + days : (days === 0 ? 'D-DAY' : '진행중');
  document.getElementById('opts').addEventListener('click', (e) => {
    const b = e.target.closest('.opt'); if (!b) return;
    document.querySelectorAll('#opts .opt').forEach(o => o.classList.remove('sel'));
    b.classList.add('sel');
  });
</script>
</body>
</html>
