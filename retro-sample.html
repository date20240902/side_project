<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>월승치못 · 레트로 게임 스타일 샘플</title>
<link rel="stylesheet" href="https://fastly.jsdelivr.net/gh/quiple/galmuri/dist/Galmuri.css">
<style>
  :root {
    --sky-top: #bfe0ff;
    --sky-mid: #f6c9e6;
    --sky-low: #b6a2ec;
    --ink: #27235a;
    --gold: #ffd24a;
    --red: #ef5d6b;
    --green: #74c96a;
    --city-back: #7868be;
    --city-front: #443a82;
    --win: #ffe08a;
    --field-a: #4bab4b;
    --field-b: #429a42;
    --panel: #f7ecd9;
    --panel-2: #efe0c8;
    --teal: #7cc6c0;
    --orange: #e7913f;
    --blue: #6f8fe0;
    --kakao: #FEE500;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; min-height: 100%;
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 60%, var(--sky-low) 100%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Galmuri11', monospace;
    -webkit-font-smoothing: none;
  }
  .col { max-width: 460px; margin: 0 auto; padding: 0 0 40px; }

  /* ===== GAME TITLE SCREEN ===== */
  .screen {
    position: relative;
    height: 500px;
    overflow: hidden;
    border: 4px solid var(--ink);
    border-radius: 4px;
    margin: 14px 14px 22px;
    box-shadow: 0 6px 0 rgba(39,35,90,0.35);
    background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-mid) 62%, var(--sky-low) 100%);
  }

  /* stars / sparkles */
  .star { position: absolute; color: #fff; font-size: 12px; opacity: 0.9; animation: tw 2.2s infinite; }
  .star.s2 { animation-delay: .7s; } .star.s3 { animation-delay: 1.3s; }
  @keyframes tw { 0%,100%{ opacity:.25; transform:scale(.8);} 50%{ opacity:1; transform:scale(1.1);} }

  /* lives */
  .lives { position: absolute; top: 12px; right: 14px; font-size: 16px; letter-spacing: 2px; z-index: 6; }

  /* skyline (stadium / city) */
  .skyline { position: absolute; left: 0; right: 0; display: flex; align-items: flex-end; z-index: 2; }
  .skyline.back { bottom: 58px; opacity: .8; }
  .skyline.front { bottom: 58px; }
  .skyline i {
    flex: 1; display: block;
    background-color: var(--city-front);
    background-image: radial-gradient(var(--win) 1px, transparent 1.6px);
    background-size: 9px 13px; background-position: 4px 7px;
    border-top: 3px solid var(--ink);
  }
  .skyline.back i { background-color: var(--city-back); background-image: none; border-top-color: rgba(39,35,90,.6); }

  /* soccer field */
  .field {
    position: absolute; left: 0; right: 0; bottom: 0; height: 60px; z-index: 3;
    background: repeating-linear-gradient(90deg, var(--field-a) 0 26px, var(--field-b) 26px 52px);
    border-top: 4px solid var(--ink);
  }
  .field .ball { position: absolute; left: 16px; bottom: 12px; font-size: 26px; }
  .field .chick { position: absolute; right: 18px; bottom: 10px; font-size: 28px; }

  /* center content */
  .title-wrap {
    position: absolute; left: 0; right: 0; top: 54px; z-index: 5;
    text-align: center; padding: 0 16px;
  }
  .badge {
    display: inline-block; font-size: 11px; color: var(--ink);
    background: var(--gold); border: 3px solid var(--ink);
    box-shadow: 2px 2px 0 var(--ink);
    padding: 4px 10px; margin-bottom: 14px;
  }
  .game-title {
    font-family: 'Galmuri14', monospace;
    font-size: 52px; line-height: 1; color: var(--gold);
    letter-spacing: 1px;
    text-shadow: 3px 3px 0 var(--red), 6px 6px 0 rgba(39,35,90,.45);
  }
  .game-sub { margin-top: 14px; font-size: 13px; color: var(--ink); }
  .game-sub .hi { color: #fff; text-shadow: 1px 1px 0 var(--ink); }

  /* START button */
  .start-wrap { position: absolute; left: 0; right: 0; bottom: 96px; z-index: 6; text-align: center; }
  .btn-start {
    font-family: 'Galmuri14', monospace; font-size: 20px;
    color: #14310f;
    background: var(--green);
    border: 4px solid var(--ink); border-radius: 999px;
    box-shadow: 0 5px 0 var(--ink);
    padding: 13px 30px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn-start:active { transform: translateY(5px); box-shadow: none; }
  .press { margin-top: 12px; font-size: 11px; color: var(--ink); animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ===== windows below ===== */
  .stage-label { text-align: center; font-family:'Galmuri14',monospace; font-size: 15px; color: var(--ink); margin: 4px 0 14px; text-shadow: 1px 1px 0 #fff; }
  .win { background: var(--panel); border: 3px solid var(--ink); border-radius: 3px; box-shadow: 5px 5px 0 rgba(39,35,90,.3); margin: 0 14px 18px; }
  .win-bar { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; border-bottom: 3px solid var(--ink); }
  .win-bar.teal { background: var(--teal); } .win-bar.orange { background: var(--orange); }
  .win-title { font-size: 13px; color: var(--ink); }
  .win-ctrls { display: flex; gap: 4px; }
  .win-ctrls i { font-style: normal; width: 18px; height: 18px; display: grid; place-items: center; background: var(--panel); border: 2px solid var(--ink); font-size: 11px; }
  .win-body { padding: 16px; }

  .gauge-top { display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; margin-bottom: 10px; }
  .gauge-num { font-family: 'Galmuri14', monospace; font-size: 20px; color: var(--orange); }
  .loadbar { height: 24px; padding: 3px; background: var(--panel-2); border: 3px solid var(--ink); border-radius: 2px; }
  .loadbar > span { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--blue) 0 11px, transparent 11px 14px); }
  .gauge-note { font-size: 11px; color: #6b5a4f; margin-top: 9px; text-align: center; } .gauge-note b { color: var(--ink); }

  .q { font-size: 15px; margin-bottom: 14px; }
  .opts { display: flex; gap: 8px; margin-bottom: 16px; }
  .opt { flex: 1; padding: 14px 0; background: var(--panel-2); color: var(--ink); border: 3px solid var(--ink); border-radius: 3px; box-shadow: 2px 2px 0 var(--ink); font-family: 'Galmuri11', monospace; font-size: 16px; cursor: pointer; }
  .opt:active { transform: translate(2px,2px); box-shadow: none; }
  .opt.sel { background: var(--red); color: #fff; }
  .ok { width: 100%; padding: 12px; background: var(--panel-2); color: var(--ink); border: 2px dashed var(--ink); border-radius: 3px; font-family: 'Galmuri11', monospace; font-size: 14px; cursor: pointer; }

  .foot { text-align: center; font-size: 11px; color: var(--ink); margin-top: 6px; opacity: .8; }
</style>
</head>
<body>
<div class="col">

  <!-- ===== TITLE SCREEN ===== -->
  <div class="screen">
    <span class="star" style="top:24px;left:30px;">✦</span>
    <span class="star s2" style="top:40px;left:120px;font-size:9px;">✦</span>
    <span class="star s3" style="top:18px;right:80px;">✦</span>
    <span class="star s2" style="top:60px;right:36px;font-size:9px;">✦</span>
    <span class="star" style="top:96px;left:54px;font-size:9px;">✦</span>

    <div class="lives">🍗🍗🍗</div>

    <div class="title-wrap">
      <div class="badge">WORLD CUP 2026</div>
      <div class="game-title">월승치못</div>
      <div class="game-sub"><span class="hi">매일 5문제 예측하고 치킨 받자</span></div>
    </div>

    <!-- skyline -->
    <div class="skyline back">
      <i style="height:54px"></i><i style="height:78px"></i><i style="height:42px"></i><i style="height:90px"></i><i style="height:60px"></i><i style="height:48px"></i><i style="height:84px"></i><i style="height:66px"></i>
    </div>
    <div class="skyline front">
      <i style="height:88px"></i><i style="height:120px"></i><i style="height:70px"></i><i style="height:104px"></i><i style="height:60px"></i><i style="height:132px"></i><i style="height:78px"></i><i style="height:112px"></i><i style="height:66px"></i>
    </div>

    <!-- field -->
    <div class="field">
      <span class="ball">⚽</span>
      <span class="chick">🍗</span>
    </div>

    <!-- START -->
    <div class="start-wrap">
      <button class="btn-start">▶ 카카오로 시작</button>
      <div class="press">PRESS START · 사전 예약 한정 더블픽 3장</div>
    </div>
  </div>

  <div class="stage-label">▼ STAGE 1 미리보기</div>

  <!-- CHICKEN GAUGE -->
  <div class="win">
    <div class="win-bar orange">
      <span class="win-title">오늘의 치킨 풀</span>
      <span class="win-ctrls"><i>_</i><i>☐</i><i>✕</i></span>
    </div>
    <div class="win-body">
      <div class="gauge-top"><span>🍗 적립된 치킨</span><b class="gauge-num">1마리</b></div>
      <div class="loadbar"><span style="width:49%"></span></div>
      <div class="gauge-note">다음 치킨까지 <b>253명</b> · 500명마다 +1마리</div>
    </div>
  </div>

  <!-- PREDICTION -->
  <div class="win">
    <div class="win-bar teal">
      <span class="win-title">오늘의 예측 &nbsp;1/5</span>
      <span class="win-ctrls"><i>_</i><i>☐</i><i>✕</i></span>
    </div>
    <div class="win-body">
      <div class="q">한국 vs 우루과이, 결과는?</div>
      <div class="opts" id="opts">
        <button class="opt sel">승</button>
        <button class="opt">무</button>
        <button class="opt">패</button>
      </div>
      <button class="ok">제출하기 ▸</button>
    </div>
  </div>

  <div class="foot">RETRO GAME STYLE SAMPLE · 본선까지 <b id="dday">D-20</b></div>
</div>

<script>
  const KICKOFF = new Date('2026-06-11T00:00:00+09:00');
  const days = Math.ceil((KICKOFF - new Date()) / 86400000);
  document.getElementById('dday').textContent = days > 0 ? 'D-' + days : (days === 0 ? 'D-DAY' : '진행중');

  document.getElementById('opts').addEventListener('click', (e) => {
    const b = e.target.closest('.opt');
    if (!b) return;
    document.querySelectorAll('#opts .opt').forEach(o => o.classList.remove('sel'));
    b.classList.add('sel');
  });
</script>
</body>
</html>
