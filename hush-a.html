<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>hush-a</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #060814; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resize() {
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    canvas.style.width = innerWidth + 'px';
    canvas.style.height = innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  resize();
  addEventListener('resize', resize);

  const MAX = 50;
  const stars = [];
  const BG = '#060814';
  const LIFESPAN = 35000;
  const FADE_IN = 5000;
  const FADE_OUT = 8000;

  function spawn(x, y) {
    if (stars.length >= MAX) return;
    stars.push({
      x, y,
      born: performance.now(),
      coreSize: 0.7 + Math.random() * 0.8,
      glowRadius: 38 + Math.random() * 22,
      twinkleSeed: Math.random() * Math.PI * 2,
    });
  }

  addEventListener('pointerdown', e => spawn(e.clientX, e.clientY));

  let nextAuto = performance.now() + 3000 + Math.random() * 2000;
  function scheduleNext(now) {
    nextAuto = now + 25000 + Math.random() * 10000;
  }

  function frame() {
    const now = performance.now();
    const w = innerWidth;
    const h = innerHeight;

    if (now >= nextAuto) {
      spawn(Math.random() * w, h + 10);
      scheduleNext(now);
    }

    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, w, h);

    for (let i = stars.length - 1; i >= 0; i--) {
      const s = stars[i];
      const age = now - s.born;
      const t = age / LIFESPAN;
      if (t >= 1) { stars.splice(i, 1); continue; }

      const rise = (h + 200) * t;
      const x = s.x;
      const y = s.y - rise;

      let a;
      if (age < FADE_IN) a = age / FADE_IN;
      else if (age > LIFESPAN - FADE_OUT) a = (LIFESPAN - age) / FADE_OUT;
      else a = 1;

      const twinkle = 0.85 + 0.15 * Math.sin(now / 800 + s.twinkleSeed);
      a *= twinkle;
      if (a <= 0) continue;

      const grad = ctx.createRadialGradient(x, y, 0, x, y, s.glowRadius);
      grad.addColorStop(0, `rgba(210, 230, 255, ${0.45 * a})`);
      grad.addColorStop(0.3, `rgba(180, 200, 240, ${0.12 * a})`);
      grad.addColorStop(1, 'rgba(180, 200, 240, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(x, y, s.glowRadius, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = `rgba(255, 255, 255, ${a})`;
      ctx.beginPath();
      ctx.arc(x, y, s.coreSize, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
